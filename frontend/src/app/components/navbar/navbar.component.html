<nav class="fixed top-0 left-0 w-full z-[100] transition-all duration-500 bg-slate-950/80 backdrop-blur-xl border-b border-white/5 py-4">
  <div class="container mx-auto px-6 flex justify-between items-center">
    
    <!-- Logo -->
    <div (click)="scrollToSection('top')" class="text-2xl font-black italic tracking-tighter cursor-pointer group flex items-center gap-2">
      <span class="text-blue-500 group-hover:scale-110 transition-transform">EU</span>
      <span class="text-white group-hover:text-blue-400 transition-colors">LAB</span>
    </div>

    <!-- Desktop Menu -->
    <div class="hidden md:flex items-center gap-10">
      <button (click)="scrollToSection('about')" class="nav-link cursor-pointer">Chi Siamo</button>
      <button (click)="scrollToSection('services')" class="nav-link cursor-pointer">Servizi</button>
      <button (click)="scrollToSection('skills')" class="nav-link cursor-pointer">Tech & Partner</button>
      <button (click)="scrollToSection('projects')" class="nav-link cursor-pointer">Progetti</button>
      
      <button (click)="scrollToSection('contact')" 
         class="px-8 py-3 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase tracking-widest transition-all hover:scale-105 active:scale-95 shadow-lg shadow-blue-900/20 cursor-pointer">
        Contattami
      </button>
    </div>

    <!-- Mobile Menu Toggle -->
    <button (click)="toggleMenu()" class="md:hidden relative z-[110] p-2 text-white">
      <div class="w-6 h-5 flex flex-col justify-between overflow-hidden">
        <span [class]="'w-full h-0.5 bg-white transition-all duration-300 ' + (isMenuOpen() ? 'rotate-45 translate-y-2' : '')"></span>
        <span [class]="'w-full h-0.5 bg-white transition-all duration-300 ' + (isMenuOpen() ? 'opacity-0 translate-x-10' : '')"></span>
        <span [class]="'w-full h-0.5 bg-white transition-all duration-300 ' + (isMenuOpen() ? '-rotate-45 -translate-y-2' : '')"></span>
      </div>
    </button>
  </div>

  <!-- Mobile Overlay -->
  @if (isMenuOpen()) {
    <div class="fixed inset-0 z-[100] bg-slate-950/40 backdrop-blur-[80px] md:hidden animate-fadeIn">
      <div class="flex flex-col items-center justify-center h-full gap-8">
        <button (click)="scrollToSection('about')" class="mobile-menu-link text-3xl font-bold text-white hover:text-blue-500 transition-colors italic">Chi Siamo</button>
        <button (click)="scrollToSection('services')" class="mobile-menu-link text-3xl font-bold text-white hover:text-blue-500 transition-colors italic">Servizi</button>
        <button (click)="scrollToSection('skills')" class="mobile-menu-link text-3xl font-bold text-white hover:text-blue-500 transition-colors italic">Tech & Partner</button>
        <button (click)="scrollToSection('projects')" class="mobile-menu-link text-3xl font-bold text-white hover:text-blue-500 transition-colors italic">Progetti</button>
        <button (click)="scrollToSection('blog')" class="mobile-menu-link text-3xl font-bold text-white hover:text-blue-500 transition-colors italic">Blog</button>
        <button (click)="scrollToSection('contact')" 
           class="mobile-menu-link mt-8 px-12 py-5 rounded-2xl bg-blue-600 text-white font-bold uppercase tracking-widest text-sm shadow-2xl">
          Contattami
        </button>
      </div>
    </div>
  }
</nav>
