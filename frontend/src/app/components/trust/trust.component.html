<div class="py-12 bg-slate-950/50 border-y border-white/5 relative">
  <div class="container mx-auto px-6 trust-container">
    
    <!-- Desktop Grid (hidden on mobile) -->
    <div class="hidden md:grid grid-cols-4 gap-12">
        @for (stat of stats(); track stat.label; let i = $index) {
          <div class="text-center group">
            <div class="text-4xl mb-4 transform transition-transform group-hover:scale-110 group-hover:rotate-6 duration-300">{{stat.icon}}</div>
            <div class="text-4xl font-black text-white mb-2 tracking-tighter">
                {{displayValues()[i]}}{{stat.suffix}}
            </div>
            <div class="text-[10px] uppercase tracking-[2px] text-gray-500 font-bold group-hover:text-blue-500 transition-colors">
                {{stat.label}}
            </div>
          </div>
        }
    </div>

    <!-- Mobile Carousel (Snap points) -->
    <div class="md:hidden flex overflow-x-auto snap-x snap-mandatory scrollbar-hide py-4 -mx-6 px-6 gap-6">
        @for (stat of stats(); track stat.label; let i = $index) {
          <div class="min-w-[70vw] snap-center glass-panel p-8 rounded-3xl border border-white/5 flex flex-col items-center text-center mobile-trust-card transition-all duration-300">
             <div class="text-5xl mb-6">{{stat.icon}}</div>
             <div class="text-4xl font-black text-white mb-2 italic">
                {{displayValues()[i]}}{{stat.suffix}}
             </div>
             <div class="text-[10px] uppercase tracking-[2px] text-blue-400 font-bold">
                {{stat.label}}
             </div>
          </div>
        }
    </div>

  </div>
</div>
